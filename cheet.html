<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Diario de Trabajo & Planificador</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-card: #1e1e1e;
      --bg-input: #2a2a2a;
      --accent: #00adb5;
      --accent-hover: #00888e;
      --text-main: #e0e0e0;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --tag-work: #ff9800;
      --tag-home: #4caf50;
      --tag-project: #9c27b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      color: var(--accent);
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .stats-group {
      display: flex;
      gap: 10px;
    }

    header .stats {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 6px 12px;
      border-radius: 20px;
    }

    header .stats-money {
      color: #4caf50;
      font-weight: bold;
    }

    /* Formulario principal */
    .card-form {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-form h2 {
      font-size: 16px;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    select {
      min-width: 140px;
    }

    textarea {
      width: 100%;
      height: 80px;
      resize: vertical;
    }

    /* Subsección de Materiales / Compras */
    .budget-section {
      background: #161616;
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .budget-section h3 {
      font-size: 14px;
      color: var(--text-muted);
    }

    .item-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .item-row input[type="number"] {
      width: 90px;
    }

    .btn-small {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .btn-small.remove {
      background: #f44336;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      flex: 1;
      min-width: 200px;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-custom-btn {
      display: block;
      background: var(--bg-input);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .file-custom-btn:hover {
      background: #252525;
    }

    .preview-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .img-preview-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    /* Barra de búsqueda y filtros */
    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
    }

    /* Contenedor de notas */
    .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .note-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border-left: 5px solid var(--accent);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s;
    }

    .note-card.completed {
      border-left-color: #4caf50;
      opacity: 0.8;
    }

    .note-card.completed .note-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .note-title {
      font-size: 17px;
      font-weight: bold;
      color: #fff;
    }

    .tag {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .tag-trabajo { background: rgba(255, 152, 0, 0.2); color: var(--tag-work); }
    .tag-casa { background: rgba(76, 175, 80, 0.2); color: var(--tag-home); }
    .tag-proyecto { background: rgba(156, 39, 176, 0.2); color: var(--tag-project); }

    .note-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 15px;
    }

    .note-details {
      font-size: 14px;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
    }

    /* Tabla de materiales dentro de la nota */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 5px;
      background: #181818;
      border-radius: 6px;
      overflow: hidden;
    }

    .items-table th, .items-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #2a2a2a;
    }

    .items-table th {
      color: var(--accent);
      background: #222;
    }

    .items-table .total-row {
      font-weight: bold;
      color: #4caf50;
      background: #202020;
    }

    /* Galería de fotos */
    .note-gallery {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .note-gallery img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: transform 0.2s;
    }

    .note-gallery img:hover {
      transform: scale(1.05);
    }

    .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 5px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .btn-action {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      border-color: var(--accent);
    }

    .btn-action.delete:hover {
      border-color: #f44336;
      color: #f44336;
    }

    .btn-action.check:hover {
      border-color: #4caf50;
      color: #4caf50;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>📓 Bitácora & Diario Personal</h1>
      <div class="stats-group">
        <div class="stats" id="statsCounter">0 Registros</div>
        <div class="stats stats-money" id="statsTotalMoney">Total: $0.00</div>
      </div>
    </header>

    <!-- Formulario para agregar entrada con matemática -->
    <div class="card-form">
      <h2>Nueva Entrada / Tarea</h2>
      
      <div class="form-row">
        <input type="text" id="entryTitle" placeholder="Título (ej: Reparación de puertas, Compras para la casa...)" autocomplete="off">
        <select id="entryCategory">
          <option value="Trabajo">💼 Trabajo</option>
          <option value="Casa">🏠 Casa</option>
          <option value="Proyecto">⚡ Proyecto / Idea</option>
        </select>
      </div>

      <textarea id="entryDetails" placeholder="Detalles, notas técnicas, mediciones o explicaciones..."></textarea>

      <!-- Subformulario de presupuesto / matemática -->
      <div class="budget-section">
        <h3>🛒 Lista de Compras / Materiales (Matemática)</h3>
        
        <div class="item-row">
          <input type="text" id="itemName" placeholder="Artículo (ej: Bisagras, Pintura, Combustible)">
          <input type="number" id="itemQty" placeholder="Cant." min="1" value="1">
          <input type="number" id="itemPrice" placeholder="Precio ($)" step="0.01">
          <button class="btn-small" onclick="addItemToDraft()">+ Agregar</button>
        </div>

        <div class="items-list" id="draftItemsList"></div>
      </div>

      <div class="form-row" style="align-items: center;">
        <div class="file-input-wrapper">
          <label for="entryPhotos" class="file-custom-btn">📷 Adjuntar Fotos (Evidencia)</label>
          <input type="file" id="entryPhotos" accept="image/*" multiple onchange="previewImages(event)">
        </div>
        <button class="btn-submit" onclick="addEntry()">+ Guardar en mi Bitácora</button>
      </div>

      <div class="preview-container" id="previewArea"></div>
    </div>

    <!-- Filtro y Búsqueda -->
    <div class="controls-bar">
      <input type="text" class="search-box" id="searchInput" placeholder="🔍 Buscar por palabra clave..." oninput="filterEntries()">
      <select id="filterCategory" onchange="filterEntries()">
        <option value="Todos">Todas las categorías</option>
        <option value="Trabajo">💼 Trabajo</option>
        <option value="Casa">🏠 Casa</option>
        <option value="Proyecto">⚡ Proyecto</option>
      </select>
    </div>

    <!-- Lista de Notas -->
    <div class="notes-grid" id="notesGrid"></div>
  </div>

  <!-- Modal para ver foto ampliada -->
  <div class="modal" id="imageModal" onclick="closeModal()">
    <img id="modalImg" src="" alt="Foto ampliada">
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('my_journal_entries')) || [];
    let currentBase64Images = [];
    let draftItems = []; // Almacena temporalmente los artículos del formulario actual

    function saveToStorage() {
      localStorage.setItem('my_journal_entries', JSON.stringify(entries));
      renderEntries();
    }

    function addItemToDraft() {
      const nameInput = document.getElementById('itemName');
      const qtyInput = document.getElementById('itemQty');
      const priceInput = document.getElementById('itemPrice');

      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value) || 1;
      const price = parseFloat(priceInput.value) || 0;

      if (name === '') {
        alert('Escribe el nombre del artículo');
        return;
      }

      draftItems.push({
        name: name,
        qty: qty,
        price: price,
        subtotal: qty * price
      });

      nameInput.value = '';
      qtyInput.value = '1';
      priceInput.value = '';
      nameInput.focus();

      renderDraftItems();
    }

    function removeDraftItem(index) {
      draftItems.splice(index, 1);
      renderDraftItems();
    }

    function renderDraftItems() {
      const container = document.getElementById('draftItemsList');
      container.innerHTML = '';

      let total = 0;

      draftItems.forEach((item, index) => {
        total += item.subtotal;
        const div = document.createElement('div');
        div.className = 'item-row';
        div.style.fontSize = '13px';
        div.innerHTML = `
          <span style="flex: 1;">${item.name} (${item.qty}x $${item.price.toFixed(2)})</span>
          <span style="font-weight: bold; color: #4caf50;">$${item.subtotal.toFixed(2)}</span>
          <button class="btn-small remove" onclick="removeDraftItem(${index})">✕</button>
        `;
        container.appendChild(div);
      });

      if (draftItems.length > 0) {
        const totalDiv = document.createElement('div');
        totalDiv.style.fontWeight = 'bold';
        totalDiv.style.color = '#00adb5';
        totalDiv.style.fontSize = '14px';
        totalDiv.style.marginTop = '5px';
        totalDiv.textContent = `Total estimado: $${total.toFixed(2)}`;
        container.appendChild(totalDiv);
      }
    }

    function previewImages(event) {
      const files = event.target.files;
      const previewArea = document.getElementById('previewArea');
      previewArea.innerHTML = '';
      currentBase64Images = [];

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'img-preview-thumb';
          previewArea.appendChild(img);
          currentBase64Images.push(e.target.result);
        };
        reader.readAsDataURL(file);
      });
    }

    function addEntry() {
      const title = document.getElementById('entryTitle').value.trim();
      const category = document.getElementById('entryCategory').value;
      const details = document.getElementById('entryDetails').value.trim();

      if (title === '') {
        alert('Por favor ponle un título a la entrada.');
        return;
      }

      const totalItemsCost = draftItems.reduce((acc, curr) => acc + curr.subtotal, 0);

      const newEntry = {
        id: Date.now(),
        title: title,
        category: category,
        details: details,
        items: [...draftItems],
        totalCost: totalItemsCost,
        photos: [...currentBase64Images],
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        completed: false
      };

      entries.unshift(newEntry);
      saveToStorage();

      // Limpiar todo el formulario
      document.getElementById('entryTitle').value = '';
      document.getElementById('entryDetails').value = '';
      document.getElementById('entryPhotos').value = '';
      document.getElementById('previewArea').innerHTML = '';
      document.getElementById('draftItemsList').innerHTML = '';
      draftItems = [];
      currentBase64Images = [];
    }

    function toggleComplete(id) {
      entries = entries.map(entry => {
        if (entry.id === id) {
          return { ...entry, completed: !entry.completed };
        }
        return entry;
      });
      saveToStorage();
    }

    function deleteEntry(id) {
      if (confirm('¿Estás seguro de que quieres borrar este registro?')) {
        entries = entries.filter(entry => entry.id !== id);
        saveToStorage();
      }
    }

    function openModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = imgSrc;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function filterEntries() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const categoryFilter = document.getElementById('filterCategory').value;

      const filtered = entries.filter(entry => {
        const matchesQuery = entry.title.toLowerCase().includes(query) || entry.details.toLowerCase().includes(query);
        const matchesCat = categoryFilter === 'Todos' || entry.category === categoryFilter;
        return matchesQuery && matchesCat;
      });

      renderGrid(filtered);
    }

    function renderEntries() {
      filterEntries();
    }

    function renderGrid(dataList) {
      const grid = document.getElementById('notesGrid');
      const statsCounter = document.getElementById('statsCounter');
      const statsTotalMoney = document.getElementById('statsTotalMoney');
      grid.innerHTML = '';

      statsCounter.textContent = `${entries.length} Registro(s)`;

      const globalMoney = entries.reduce((acc, curr) => acc + (curr.totalCost || 0), 0);
      statsTotalMoney.textContent = `Total: $${globalMoney.toFixed(2)}`;

      if (dataList.length === 0) {
        grid.innerHTML = `<div class="empty-state">No hay registros guardados todavía. ¡Empieza creando uno arriba!</div>`;
        return;
      }

      dataList.forEach(item => {
        const card = document.createElement('div');
        card.className = `note-card ${item.completed ? 'completed' : ''}`;

        let tagClass = 'tag-trabajo';
        if (item.category === 'Casa') tagClass = 'tag-casa';
        if (item.category === 'Proyecto') tagClass = 'tag-proyecto';

        // Construir tabla de compras si existen
        let itemsHTML = '';
        if (item.items && item.items.length > 0) {
          itemsHTML = `
            <table class="items-table">
              <thead>
                <tr>
                  <th>Artículo</th>
                  <th>Cant.</th>
                  <th>Precio</th>
                  <th>Subtotal</th>
                </tr>
              </thead>
              <tbody>
          `;

          item.items.forEach(it => {
            itemsHTML += `
              <tr>
                <td>${it.name}</td>
                <td>${it.qty}</td>
                <td>$${it.price.toFixed(2)}</td>
                <td>$${it.subtotal.toFixed(2)}</td>
              </tr>
            `;
          });

          itemsHTML += `
                <tr class="total-row">
                  <td colspan="3">TOTAL ESTIMADO</td>
                  <td>$${(item.totalCost || 0).toFixed(2)}</td>
                </tr>
              </tbody>
            </table>
          `;
        }

        // Construir imágenes
        let photosHTML = '';
        if (item.photos && item.photos.length > 0) {
          photosHTML = `<div class="note-gallery">`;
          item.photos.forEach(imgData => {
            photosHTML += `<img src="${imgData}" onclick="openModal('${imgData}')" alt="Foto adjunta">`;
          });
          photosHTML += `</div>`;
        }

        card.innerHTML = `
          <div class="note-header">
            <div class="note-title">${item.title}</div>
            <span class="tag ${tagClass}">${item.category}</span>
          </div>

          <div class="note-meta">
            <span>📅 ${item.date}</span>
          </div>

          ${item.details ? `<div class="note-details">${item.details}</div>` : ''}

          ${itemsHTML}

          ${photosHTML}

          <div class="note-actions">
            <button class="btn-action check" onclick="toggleComplete(${item.id})">
              ${item.completed ? '↩️ Reabrir' : '✓ Marcar Hecho'}
            </button>
            <button class="btn-action delete" onclick="deleteEntry(${item.id})">
              ✕ Eliminar
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    renderEntries();
  </script>
</body>
</html>

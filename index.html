<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario & Planificador</title>
  <style>
    :root {
      --bg-body: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #0A84FF;
      --accent-hover: #0071E3;
      --text-main: #F5F5F7;
      --text-secondary: #8E8E93;
      --input-bg: rgba(118, 118, 128, 0.24);
      --success: #30D158;
      --danger: #FF453A;
      --tag-work: #FF9F0A;
      --tag-home: #30D158;
      --tag-project: #BF5AF2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header Estilo iOS/macOS */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 20px 24px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stats-group {
      display: flex;
      gap: 8px;
    }

    .stat-badge {
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--input-bg);
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 500;
    }

    .stat-badge.money {
      color: var(--success);
    }

    /* Pestañas (Segmented Controls) */
    .segmented-control {
      background: var(--input-bg);
      padding: 4px;
      border-radius: 14px;
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Tarjetas principales */
    .card-form, .note-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, textarea {
      background: var(--input-bg);
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    input[type="text"] { flex: 1; min-width: 200px; }
    select { min-width: 140px; cursor: pointer; }
    textarea { width: 100%; height: 70px; resize: vertical; }

    /* Módulo de Items */
    .budget-section {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .budget-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .item-row input[type="number"] { width: 100px; }

    .btn-apple-sub {
      background: var(--input-bg);
      color: var(--accent);
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-apple-sub.remove { color: var(--danger); }

    .items-draft-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-custom-btn {
      display: inline-block;
      background: var(--input-bg);
      color: var(--accent);
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      width: 100%;
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: var(--accent-hover); }

    /* Notas & Galería */
    .note-card {
      transition: all 0.25s ease;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .note-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .tag-trabajo { background: rgba(255, 159, 10, 0.2); color: var(--tag-work); }
    .tag-casa { background: rgba(48, 209, 88, 0.2); color: var(--tag-home); }
    .tag-proyecto { background: rgba(191, 90, 242, 0.2); color: var(--tag-project); }

    .note-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .note-details {
      font-size: 14px;
      color: #D1D1D6;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    /* Tabla minimalista */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .items-table th, .items-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    .items-table th { color: var(--text-secondary); font-weight: 500; }
    .items-table .total-row { font-weight: 700; color: var(--success); }

    .note-gallery {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .note-gallery img, .img-preview-thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--card-border);
    }

    .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }

    .btn-action {
      background: var(--input-bg);
      border: none;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-action.archive { color: var(--accent); }
    .btn-action.delete { color: var(--danger); }

    /* Modal / Lightbox */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img { max-width: 90%; max-height: 85vh; border-radius: 16px; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .tab-content { display: none; flex-direction: column; gap: 16px; }
    .tab-content.active { display: flex; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Diario & Bitácora</h1>
      <div class="stats-group">
        <div class="stat-badge" id="statsCounter">0 Registros</div>
        <div class="stat-badge money" id="statsTotalMoney">$0.00</div>
      </div>
    </header>

    <!-- Navegación por pestañas -->
    <div class="segmented-control">
      <button class="tab-btn active" onclick="switchTab('active')">Pendientes & Activas</button>
      <button class="tab-btn" onclick="switchTab('archived')">📁 Archivo de Finalizadas</button>
    </div>

    <!-- Pestaña 1: Tareas Activas y Formulario -->
    <div id="tab-active" class="tab-content active">
      <!-- Formulario para agregar -->
      <div class="card-form">
        <div class="form-row">
          <input type="text" id="entryTitle" placeholder="Título (Presiona Enter para guardar rápido)..." autocomplete="off" onkeydown="handleKeyPress(event)">
          <select id="entryCategory">
            <option value="Trabajo">💼 Trabajo</option>
            <option value="Casa">🏠 Casa</option>
            <option value="Proyecto">⚡ Proyecto</option>
          </select>
        </div>

        <textarea id="entryDetails" placeholder="Detalles, notas técnicas, mediciones o explicaciones..."></textarea>

        <!-- Submódulo Presupuesto / Materiales -->
        <div class="budget-section">
          <div class="budget-title">Desglose de Materiales / Precios (Enter para agregar artículo)</div>
          <div class="item-row">
            <input type="text" id="itemName" placeholder="Artículo (ej: Pintura, Bisagra)" onkeydown="handleItemKeyPress(event)">
            <input type="number" id="itemQty" placeholder="Cant." min="1" value="1" onkeydown="handleItemKeyPress(event)">
            <input type="number" id="itemPrice" placeholder="Precio ($)" step="0.01" onkeydown="handleItemKeyPress(event)">
            <button class="btn-apple-sub" onclick="addItemToDraft()">+ Añadir</button>
          </div>
          <div class="items-draft-list" id="draftItemsList"></div>
        </div>

        <div class="form-row">
          <label for="entryPhotos" class="file-custom-btn">📷 Adjuntar Fotos</label>
          <input type="file" id="entryPhotos" accept="image/*" multiple style="display:none;" onchange="previewImages(event)">
        </div>

        <div class="preview-container note-gallery" id="previewArea"></div>

        <button class="btn-submit" onclick="addEntry()">Guardar Entrada</button>
      </div>

      <!-- Buscador -->
      <input type="text" id="searchInput" placeholder="🔍 Buscar..." oninput="renderEntries()">

      <!-- Lista de Notas Activas -->
      <div class="notes-grid" id="activeNotesGrid"></div>
    </div>

    <!-- Pestaña 2: Archivo -->
    <div id="tab-archived" class="tab-content">
      <input type="text" id="searchArchivedInput" placeholder="🔍 Buscar en el archivo..." oninput="renderEntries()">
      <div class="notes-grid" id="archivedNotesGrid"></div>
    </div>
  </div>

  <!-- Modal Lightbox -->
  <div class="modal" id="imageModal" onclick="closeModal()">
    <img id="modalImg" src="" alt="Vista Previa">
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('my_journal_entries_apple')) || [];
    let currentBase64Images = [];
    let draftItems = [];
    let currentTab = 'active';

    function saveToStorage() {
      localStorage.setItem('my_journal_entries_apple', JSON.stringify(entries));
      renderEntries();
    }

    /* Control de Pestañas */
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tab === 'active') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-active').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-archived').classList.add('active');
      }
      renderEntries();
    }

    /* Eventos Enter */
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        addEntry();
      }
    }

    function handleItemKeyPress(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        addItemToDraft();
      }
    }

    /* Artículos de presupuesto */
    function addItemToDraft() {
      const nameInput = document.getElementById('itemName');
      const qtyInput = document.getElementById('itemQty');
      const priceInput = document.getElementById('itemPrice');

      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value) || 1;
      const price = parseFloat(priceInput.value) || 0;

      if (!name) return;

      draftItems.push({ name, qty, price, subtotal: qty * price });

      nameInput.value = '';
      qtyInput.value = '1';
      priceInput.value = '';
      nameInput.focus();

      renderDraftItems();
    }

    function removeDraftItem(index) {
      draftItems.splice(index, 1);
      renderDraftItems();
    }

    function renderDraftItems() {
      const container = document.getElementById('draftItemsList');
      container.innerHTML = '';
      let total = 0;

      draftItems.forEach((item, index) => {
        total += item.subtotal;
        const div = document.createElement('div');
        div.className = 'item-row';
        div.style.fontSize = '13px';
        div.innerHTML = `
          <span style="flex: 1;">${item.name} (${item.qty}x $${item.price.toFixed(2)})</span>
          <span style="font-weight: 600; color: var(--success);">$${item.subtotal.toFixed(2)}</span>
          <button class="btn-apple-sub remove" onclick="removeDraftItem(${index})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    /* Imágenes */
    function previewImages(event) {
      const files = event.target.files;
      const previewArea = document.getElementById('previewArea');
      previewArea.innerHTML = '';
      currentBase64Images = [];

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'img-preview-thumb';
          previewArea.appendChild(img);
          currentBase64Images.push(e.target.result);
        };
        reader.readAsDataURL(file);
      });
    }

    /* Agregar Nota */
    function addEntry() {
      const titleInput = document.getElementById('entryTitle');
      const title = titleInput.value.trim();
      const category = document.getElementById('entryCategory').value;
      const details = document.getElementById('entryDetails').value.trim();

      if (!title) return;

      const totalItemsCost = draftItems.reduce((acc, curr) => acc + curr.subtotal, 0);

      const newEntry = {
        id: Date.now(),
        title,
        category,
        details,
        items: [...draftItems],
        totalCost: totalItemsCost,
        photos: [...currentBase64Images],
        date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ', ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        archived: false
      };

      entries.unshift(newEntry);
      saveToStorage();

      // Limpieza
      titleInput.value = '';
      document.getElementById('entryDetails').value = '';
      document.getElementById('entryPhotos').value = '';
      document.getElementById('previewArea').innerHTML = '';
      document.getElementById('draftItemsList').innerHTML = '';
      draftItems = [];
      currentBase64Images = [];
    }

    function toggleArchive(id) {
      entries = entries.map(entry => entry.id === id ? { ...entry, archived: !entry.archived } : entry);
      saveToStorage();
    }

    function deleteEntry(id) {
      if (confirm('¿Eliminar este registro permanentemente?')) {
        entries = entries.filter(entry => entry.id !== id);
        saveToStorage();
      }
    }

    function openModal(imgSrc) {
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    /* Renderizado general */
    function renderEntries() {
      const activeGrid = document.getElementById('activeNotesGrid');
      const archivedGrid = document.getElementById('archivedNotesGrid');
      const searchQuery = (currentTab === 'active' ? document.getElementById('searchInput').value : document.getElementById('searchArchivedInput').value).toLowerCase();

      activeGrid.innerHTML = '';
      archivedGrid.innerHTML = '';

      const activeEntries = entries.filter(e => !e.archived && (e.title.toLowerCase().includes(searchQuery) || e.details.toLowerCase().includes(searchQuery)));
      const archivedEntries = entries.filter(e => e.archived && (e.title.toLowerCase().includes(searchQuery) || e.details.toLowerCase().includes(searchQuery)));

      // Métricas superiores
      document.getElementById('statsCounter').textContent = `${entries.length} Registros`;
      const globalCost = entries.reduce((acc, curr) => acc + (curr.totalCost || 0), 0);
      document.getElementById('statsTotalMoney').textContent = `$${globalCost.toFixed(2)}`;

      const targetList = currentTab === 'active' ? activeEntries : archivedEntries;
      const targetGrid = currentTab === 'active' ? activeGrid : archivedGrid;

      if (targetList.length === 0) {
        targetGrid.innerHTML = `<div class="empty-state">${currentTab === 'active' ? 'No hay tareas activas.' : 'El archivo está vacío.'}</div>`;
        return;
      }

      targetList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'note-card';

        let tagClass = 'tag-trabajo';
        if (item.category === 'Casa') tagClass = 'tag-casa';
        if (item.category === 'Proyecto') tagClass = 'tag-proyecto';

        let itemsHTML = '';
        if (item.items && item.items.length > 0) {
          itemsHTML = `
            <table class="items-table">
              <thead><tr><th>Artículo</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
              <tbody>
          `;
          item.items.forEach(it => {
            itemsHTML += `<tr><td>${it.name}</td><td>${it.qty}</td><td>$${it.price.toFixed(2)}</td><td>$${it.subtotal.toFixed(2)}</td></tr>`;
          });
          itemsHTML += `<tr class="total-row"><td colspan="3">Total</td><td>$${item.totalCost.toFixed(2)}</td></tr></tbody></table>`;
        }

        let photosHTML = '';
        if (item.photos && item.photos.length > 0) {
          photosHTML = `<div class="note-gallery">`;
          item.photos.forEach(imgData => {
            photosHTML += `<img src="${imgData}" onclick="openModal('${imgData}')" alt="Foto">`;
          });
          photosHTML += `</div>`;
        }

        card.innerHTML = `
          <div class="note-header">
            <div>
              <div class="note-title">${item.title}</div>
              <div class="note-date">${item.date}</div>
            </div>
            <span class="tag ${tagClass}">${item.category}</span>
          </div>
          ${item.details ? `<div class="note-details">${item.details}</div>` : ''}
          ${itemsHTML}
          ${photosHTML}
          <div class="note-actions">
            <button class="btn-action archive" onclick="toggleArchive(${item.id})">
              ${item.archived ? '↩️ Desarchivar' : '📁 Archivar'}
            </button>
            <button class="btn-action delete" onclick="deleteEntry(${item.id})">Eliminar</button>
          </div>
        `;
        targetGrid.appendChild(card);
      });
    }

    renderEntries();
  </script>
</body>
</html>
